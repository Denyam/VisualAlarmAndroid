name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Configure debug keystore
      if: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
      run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew clean assembleDebug -PversionCode=${{ github.run_number }}

    - name: Create Tag
      id: create_tag
      run: |
          TAG="build-${{ github.run_number }}"
          git tag "$TAG"
          git push origin "$TAG"
          
    - name: Send APK to Telegram
      run: |
          FILE_PATH="app/build/outputs/apk/debug/app-debug.apk"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/app-debug.apk"
          MESSAGE="Вот будильник!
          Build number: ${{ github.run_number }}
          Commit: ${{ github.event.head_commit.id }}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.SOPHIE_TELEGRAM_ID }}" \
            -F caption="$MESSAGE" \
            -F document=@"$FILE_PATH"
