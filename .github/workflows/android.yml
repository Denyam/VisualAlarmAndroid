name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew clean assembleDebug -PversionCode=${{ github.run_number }}

    - name: Create Release and Upload APK
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
    - name: Send APK Link to Telegram
      run: |
          APK_URL="https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/app-debug.apk"
          MESSAGE="New APK Build Ready!
          Commit: ${{ github.event.head_commit.message }}
          📥 [Download APK]($APK_URL)"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.SOPHIE_TELEGRAM_ID }}" \
            -d parse_mode="Markdown" \
            -d text="$MESSAGE"
